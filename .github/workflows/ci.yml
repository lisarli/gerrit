name: CI

on:
  push:
  pull_request:

jobs:
  bazel-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools/node_tools dependencies
        run: cd tools/node_tools && yarn install --frozen-lockfile

      # Materialize polygerrit-ui/app/node_modules so @ui_npm matches CI and developer machines, and
      # lockfile issues fail before a long Bazel analysis.
      - name: Install polygerrit-ui/app dependencies
        run: cd polygerrit-ui/app && yarn install --frozen-lockfile

      - name: Install Bazelisk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -L -o "$HOME/.local/bin/bazelisk" \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x "$HOME/.local/bin/bazelisk"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bazelisk version

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
            ~/.gerritcodereview/bazel-cache
          key: ${{ runner.os }}-bazel-${{ hashFiles('**/MODULE.bazel', '**/MODULE.bazel.lock', '**/WORKSPACE', '**/WORKSPACE.bzlmod', '**/.bazelrc') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Run Java tests
        run: |
          bazelisk test --flaky_test_attempts=2 -- //javatests/... \
            -//javatests/com/google/gerrit/common:server_tests \
            -//javatests/com/google/gerrit/util/concurrent:concurrent_tests \
            -//javatests/com/google/gerrit/acceptance/server/quota:server_quota \
            -//plugins/replication:src_test_java_com_googlesource_gerrit_plugins_replication_ReplicationEventsIT \
            -//plugins/replication:src_test_java_com_googlesource_gerrit_plugins_replication_ReplicationIT
